<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>移步到位 · 导航到最美的拍照机位</title>
<link rel="stylesheet" href="css/style.css?v=202609271624">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logoMark" viewBox="0 0 160 160"><g fill="none" stroke="#2A2521" stroke-width="10" stroke-linecap="round"><path d="M24 50V24h26M110 24h26v26M136 110v26h-26M50 136H24v-26"/></g><path d="M80 108 L56 60 A54 54 0 0 1 104 60 Z" fill="#D98C2B"/><circle cx="80" cy="108" r="11" fill="#2A2521"/><circle cx="112" cy="46" r="8" fill="#2B3A67"/></symbol></svg>
  <header class="topbar">
    <div class="brand">
      <button class="back" id="btnHome" aria-label="回到首页">‹</button>
      <svg class="brand-mark" viewBox="0 0 160 160" width="30" height="30" aria-hidden="true"><g fill="none" stroke="#2A2521" stroke-width="10" stroke-linecap="round"><path d="M24 50V24h26M110 24h26v26M136 110v26h-26M50 136H24v-26"/></g><path d="M80 108 L56 60 A54 54 0 0 1 104 60 Z" fill="#D98C2B"/><circle cx="80" cy="108" r="11" fill="#2A2521"/><circle cx="112" cy="46" r="8" fill="#2B3A67"/></svg>
      <div>
        <div class="brand-name">移步到位</div>
        <div class="brand-sub">导航到最美的拍照机位</div>
      </div>
    </div>
    <div class="top-actions"><button class="btn-ghost" id="btnUpload">＋<span class="lbl"> 上传</span></button><button class="btn-ghost" id="btnDemo">▶<span class="lbl"> 演示</span></button><button class="btn-ghost btn-acc" id="btnAccount">登录</button></div>
  </header>

  <nav class="chips" id="chips">
    <button data-f="all" class="on">全部</button>
    <button data-f="classic">名场面复刻</button>
    <button data-f="skill">技法出片</button>
    <button data-f="wonder">专业奇观</button>
    <button data-f="route">路线</button>
    <button data-f="c:film">影视取景地</button>
    <button data-f="c:textbook">课本里的世界</button>
    <button data-f="c:rmb">人民币里的中国</button>
    <button data-f="mine">我的巡礼</button>
  </nav>

  <div id="map"></div>

  <div class="status-pill" id="statusPill"></div>

  <!-- 底部卡片：机位 / 路线 / 奇观 共用 -->
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-grip" id="sheetGrip"></div>
    <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <!-- 路书模式：全屏一步一步走 -->
  <section class="guide" id="guide" aria-hidden="true">
    <div class="guide-top">
      <button class="btn-ghost dark" id="guideExit">× 退出</button>
      <div class="guide-progress" id="guideProgress"></div>
    </div>
    <div class="guide-stage" id="guideStage"></div>
    <div class="guide-bottom">
      <button class="btn-ghost dark" id="guidePrev">上一步</button>
      <button class="btn-main" id="guideNext">我到了，下一步</button>
    </div>
  </section>

  <!-- 演示字幕 -->
  <div class="caption" id="caption" aria-hidden="true">
    <div class="caption-step" id="captionStep"></div>
    <div class="caption-text" id="captionText"></div>
    <button class="caption-stop" id="captionStop">停止演示</button>
  </div>

  <!-- 相机复刻：参考画面半透明叠在取景画面上 -->
  <section class="cam" id="cam" aria-hidden="true">
    <video id="camVideo" playsinline muted></video>
    <img id="camRef" alt="参考画面">
    <div class="cam-hint" id="camHint">正在打开相机…</div>
    <div class="cam-top"><button class="btn-ghost dark" id="camClose">× 关闭</button><div class="cam-tip" id="camTip"></div></div>
    <div class="cam-bottom">
      <label class="cam-alpha">参考画面透明度<input type="range" id="camAlpha" min="0" max="80" value="40"></label>
      <button class="cam-shot" id="camShot" aria-label="拍照"></button>
    </div>
  </section>

  <!-- 页面层：首页 / 列表 / 个人主页 -->
  <main class="view" id="vHome" aria-hidden="true"></main>
  <main class="view" id="vList" aria-hidden="true"></main>
  <main class="view" id="vProfile" aria-hidden="true"></main>

  <div class="toast" id="toast"></div>

  <script src="config.js?v=202609271624"></script>
  <script src="js/astro.js?v=202609271624"></script>
  <script src="js/data.js?v=202609271624"></script>
  <script src="js/map.js?v=202609271624"></script>
  <script src="js/qr.js?v=202609271624"></script>
  <script src="js/cloud.js?v=202609271624"></script>
  <script src="js/app.js?v=202609271624"></script>
  <script src="js/features.js?v=202609271624"></script>
  <script src="js/views.js?v=202609271624"></script>
</body>
</html>
