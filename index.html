<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>移步到位 · 导航到最美的拍照机位</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=202609301950">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logoMark" viewBox="0 0 160 160"><circle cx="80" cy="80" r="80" fill="#0f0f0f"/><path d="M80 118 L46 54 A70 70 0 0 1 114 54 Z" fill="#d7f36b"/><circle cx="80" cy="118" r="11" fill="#ffffff"/></symbol></svg>
  <header class="topbar">
    <button class="back" id="btnHome" aria-label="回到首页" hidden>‹</button>
    <span class="brand-name" hidden>移步到位</span>
    
    <div class="top-actions"><button class="btn-ghost" id="btnDemo" aria-label="演示">▶<span class="lbl"> 演示</span></button><button class="btn-ghost" id="btnUpload" hidden>＋</button><button class="btn-ghost btn-acc" id="btnAccount" hidden>登录</button></div>
  </header>

  <nav class="chips" id="chips">
    <button data-f="all" class="on">全部</button>
    <button data-f="c:film">影视同款</button>
    <button data-f="c:star">明星同款</button>
    <button data-f="c:textbook">书本同款</button>
    <button data-f="c:rmb">钞能力同款</button>
    <button data-f="c:landmark">城市地标</button>
    <button data-f="c:creative">创意机位</button>
    <button data-f="wonder">限定奇观</button>
  </nav>

  <div id="map"></div>
  <div class="map-labels" id="mapLabels" aria-label="地图上的机位"></div>

  <div class="map-search" role="search">
    <span aria-hidden="true">⌕</span>
    <input id="mapSearchInput" type="search" autocomplete="off" placeholder="搜索机位、地点、城市" aria-label="搜索机位、地点或城市">
    <div class="map-search-results" id="mapSearchResults" aria-live="polite"></div>
  </div>
  <button class="map-locate" id="btnLocateMap" aria-label="回到我的位置" title="回到我的位置"><span aria-hidden="true">◎</span></button>
  <div class="map-spot-rail" id="mapSpotRail" aria-label="当前地图上的机位"></div>

  <div class="status-pill" id="statusPill"></div>

  <!-- 地图页底部：我身边的机位 -->
  <section class="near" id="near" aria-label="我身边的机位"></section>

  <!-- 底部卡片：机位 / 路线 / 奇观 共用 -->
  <section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="机位详情">
    <div class="sheet-grip" id="sheetGrip"></div>
    <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-primary" id="sheetPrimary"></div>
  </section>

  <!-- 路书模式：全屏一步一步走 -->
  <section class="guide" id="guide" aria-hidden="true">
    <div class="guide-top">
      <button class="btn-ghost dark" id="guideExit">× 退出</button>
      <div class="guide-progress" id="guideProgress"></div>
    </div>
    <div class="guide-stage" id="guideStage"></div>
    <div class="guide-bottom">
      <button class="btn-ghost dark" id="guidePrev">上一步</button>
      <button class="btn-main" id="guideNext">我到了，下一步</button>
    </div>
  </section>

  <!-- 演示字幕 -->
  <div class="caption" id="caption" aria-hidden="true">
    <div class="caption-step" id="captionStep"></div>
    <div class="caption-text" id="captionText"></div>
    <button class="caption-stop" id="captionStop">停止演示</button>
  </div>

  <!-- 相机复刻：参考画面半透明叠在取景画面上 -->
  <section class="cam" id="cam" aria-hidden="true">
    <video id="camVideo" playsinline muted></video>
    <img id="camRef" alt="参考画面">
    <div class="cam-hint" id="camHint">正在打开相机…</div>
    <div class="cam-top"><button class="btn-ghost dark" id="camClose">× 关闭</button><div class="cam-tip" id="camTip"></div></div>
    <div class="cam-bottom">
      <label class="cam-alpha">参考画面透明度<input type="range" id="camAlpha" min="0" max="80" value="40"></label>
      <button class="cam-shot" id="camShot" aria-label="拍照"></button>
    </div>
  </section>

  <!-- 页面层：首页 / 列表 / 个人主页 -->
  <main class="view" id="vHome" aria-hidden="true"></main>
  <main class="view" id="vList" aria-hidden="true"></main>
  <main class="view" id="vTopic" aria-hidden="true"></main>
  <main class="view" id="vUpload" aria-hidden="true"></main>
  <main class="view" id="vProfile" aria-hidden="true"></main>

  <!-- 底部四个标签 -->
  <nav class="tabbar" id="tabbar">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>首页</span></button>
    <button data-tab="map"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><path d="M12 12.5 9.8 8a3 3 0 0 1 4.4 0z" class="fill"/></svg><span>地图</span></button>
    <button data-tab="upload" class="tab-plus"><i>＋</i><span>上传</span></button>
    <button data-tab="topic"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>专题</span></button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-4 4-5.8 7.5-5.8s6.3 1.8 7.5 5.8"/></svg><span>我的</span></button>
  </nav>

  <div class="navbar" id="navBar" aria-live="polite"></div>

  <div class="toast" id="toast"></div>

  <script src="config.js?v=202609301950"></script>
  <script src="js/astro.js?v=202609301950"></script>
  <script src="js/data.js?v=202609301950"></script>
  <script src="js/map.js?v=202609301950"></script>
  <script src="js/ux.js?v=202609301950"></script>
  <script src="js/qr.js?v=202609301950"></script>
  <script src="js/cloud.js?v=202609301950"></script>
  <script src="js/social.js?v=202609301950"></script>
  <script src="js/app.js?v=202609301950"></script>
  <script src="js/features.js?v=202609301950"></script>
  <script src="js/views.js?v=202609301950"></script>
</body>
</html>
